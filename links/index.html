<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick Crease | Links</title>
<meta name="description" content="Nick Crease's links, including the free ETF cheat sheet and my Substack.">
<link rel="canonical" href="https://zerotoinvestor.co.uk/links/">
<meta property="og:title" content="Nick Crease">
<meta property="og:description" content="Nick Crease's links, including the free ETF cheat sheet and my Substack.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zerotoinvestor.co.uk/links/">
<meta name="theme-color" content="#13131d">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-zti-32.png">
<link rel="apple-touch-icon" href="/favicon-zti-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Colours match the Stan Store page this replaces */
  :root{
    --bg:#13131d;
    --text:#ffffff;
    --muted:#84848a;
    --body:#a6a6ad;
    --border:#4d4d54;
    --button:#eceae2;
    --button-text:#111111;
    --empty:#262630;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{display:block}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--button);outline-offset:3px}

  /* ---------- Phone layout (default) ---------- */
  .page{max-width:560px;margin:0 auto;padding-bottom:44px}
  .profile{text-align:center}
  .hero{
    position:relative;overflow:hidden;
    aspect-ratio:500/360;
    background:linear-gradient(180deg,#2c2c37 0%,var(--bg) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(19,19,29,0) 38%,rgba(19,19,29,.6) 68%,var(--bg) 97%);
  }
  .hero .initials{font-size:64px;font-weight:700;color:var(--muted);opacity:.45;margin-top:-40px}
  .name{
    position:relative;z-index:1;
    margin-top:-42px;padding:0 20px;
    font-size:33px;line-height:38px;font-weight:700;letter-spacing:-.015em;
  }
  .socials{position:relative;z-index:1;display:flex;justify-content:center;margin-top:8px}
  .socials a{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px}
  .socials svg{width:21px;height:21px}
  .socials .tile{fill:#ffffff}
  .socials .glyph{fill:var(--bg)}
  .socials a:hover .tile{fill:var(--button)}

  .links{display:grid;gap:18px;padding:29px 20px 0}
  .card{
    display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:14px;padding:22px 20px 18px;
  }
  .card-head{display:flex;align-items:center;gap:14px}
  .logo{
    flex:0 0 52px;width:52px;height:52px;border-radius:10px;overflow:hidden;
    background:var(--empty);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;
  }
  .logo img{width:100%;height:100%;object-fit:cover}
  .card-name{font-size:18px;line-height:1.3;font-weight:700}
  .card-headline{margin-top:18px;font-size:21px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .card-text{margin-top:8px;font-size:15px;line-height:1.55;color:var(--body);text-wrap:pretty}
  .card-text mark{background:none;color:var(--text);font-weight:700}
  .card-foot{margin-top:auto;padding-top:20px}
  .card-btn{
    height:50px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    background:var(--button);color:var(--button-text);
    font-size:15px;font-weight:650;
    transition:filter .15s ease;
  }
  .card-btn:hover{filter:brightness(.93)}
  .card-small{margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center;text-wrap:balance}

  /* ---------- Desktop layout: profile left, cards right ---------- */
  @media (min-width:900px){
    .page{max-width:1440px;display:grid;grid-template-columns:36% 1fr;padding-bottom:0}
    .profile{
      position:sticky;top:0;height:100vh;padding-top:40px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .hero{width:180px;height:180px;aspect-ratio:auto;border-radius:8px}
    .hero::after{display:none}
    .hero .initials{font-size:44px;margin-top:0}
    .name{margin-top:22px;padding:0;font-size:25px;line-height:30px}
    .socials{gap:8px;margin-top:32px}
    .socials a{width:32px;height:32px;border:1px solid rgba(255,255,255,.3)}
    .socials svg{width:21px;height:21px}
    .links{
      max-width:532px;align-content:start;
      padding:max(56px,12vh) 72px 64px 51px;
    }
  }
  /* Wide screens: two columns of cards, like Stan */
  @media (min-width:1200px){
    .links{max-width:none;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:24px}
    /* room for two lines of small print so buttons line up across a row */
    .card-small{min-height:2.9em}
  }
</style>
</head>
<body>
<div class="page">
  <header class="profile">
    <div class="hero" id="photo"></div>
    <h1 class="name" id="name"></h1>
    <nav class="socials" id="socials" aria-label="Social links"></nav>
  </header>
  <main class="links" id="links"></main>
</div>

<script>
/* =====================================================================
   EDIT THE PAGE HERE

   Links:
   - Cards show in the order listed. Desktop puts them in two columns,
     left to right, top to bottom.
   - To add a link, copy one { ... } block, paste it where you want it,
     and change the details. Keep the comma between blocks.
   - To hide a link without deleting it, set show: false.
   - id is the short name that shows up in the click stats, so keep it
     unique, lower case, no spaces (e.g. "investengine").
   - Each card shows, top to bottom: image and name, headline, text,
     button, then smallPrint under the button.
   - code (optional) gets highlighted wherever it appears in the text.
     Leave it as "" if there's no code.
   - image is a square picture in /links/img/ (at least 216 x 216).
     Leave it as "" and the card shows the first letter of the name.

   Socials:
   - icon must be one of: instagram, tiktok, youtube, linkedin, substack

   Click stats:
   - Paste the Website ID from Umami into umamiWebsiteId to switch on
     tracking. Every card and icon click is recorded under its id.
   ===================================================================== */
const PAGE = {
  name: "Nick Crease",
  photo: "img/nick.jpg",   // square, at least 800 x 800
  umamiWebsiteId: "5dad1a61-0d95-4d49-a099-0d1449f88bc5",   // from Umami: Settings > Websites > Edit > Website ID

  socials: [
    { icon: "instagram", label: "Instagram", url: "https://www.instagram.com/nickcrease" },
    { icon: "tiktok",    label: "TikTok",    url: "https://www.tiktok.com/@nickdoesinvesting" },
    { icon: "youtube",   label: "YouTube",   url: "https://www.youtube.com/@nickcrease" },
    { icon: "linkedin",  label: "LinkedIn",  url: "https://www.linkedin.com/in/nick-crease" },
    { icon: "substack",  label: "Substack",  url: "https://substack.com/@nickcrease" },
  ],

  links: [
    {
      id: "lightyear",
      name: "Lightyear",
      headline: "Up to £100 in a free share or ETF",
      text: "Use the link below, or code NICK in the app, and deposit at least £100 within 15 days to get a free fractional share or ETF in your General Investment Account.",
      code: "NICK",
      button: "Sign up to Lightyear",
      smallPrint: "Capital at risk. T&C’s apply. Sponsored link.",
      url: "https://lightyear.com/nickcrease",
      image: "img/lightyear.png",
      show: true,
    },
    {
      id: "cheatsheet",
      name: "ETF Cheat Sheet",
      headline: "Compare widely used ETFs",
      text: "A simple one-page guide to ETFs across major regions and sectors, sent straight to your inbox.",
      code: "",
      button: "Get the free cheat sheet",
      smallPrint: "You'll also be subscribed to my investing newsletter. Unsubscribe anytime.",
      url: "https://zerotoinvestor.co.uk/cheatsheet",
      image: "img/cheatsheet.png",
      show: true,
    },
    {
      id: "monzo",
      name: "Monzo",
      headline: "Welcome bonus up to £100",
      text: "Sign up using the link below and make your first card payment within 30 days to get up to £100.",
      code: "",
      button: "Sign up to Monzo",
      smallPrint: "UK residents only. T&Cs apply. Referral link.",
      url: "https://join.monzo.com/c/14x35m6y",
      image: "img/monzo.png",
      show: true,
    },
    {
      id: "substack",
      name: "Substack",
      headline: "A free article every week",
      text: "Investing and personal finance for UK investors from an ex financial analyst.",
      code: "",
      button: "Join my free Substack",
      smallPrint: "Unsubscribe anytime.",
      url: "https://zerotoinvestor.substack.com/subscribe",
      image: "img/substack.png",
      show: true,
    },
  ],
};
/* ===================== END OF EDITABLE SECTION ===================== */

const ICONS = {
  "instagram": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><rect class=\"tile\" width=\"24\" height=\"24\" rx=\"5.5\"/><g class=\"glyph\" transform=\"translate(12 12) scale(0.66) translate(-12 -12)\"><path d=\"M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077\"/></g></svg>",
  "tiktok": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><rect class=\"tile\" width=\"24\" height=\"24\" rx=\"5.5\"/><g class=\"glyph\" transform=\"translate(12 12) scale(0.62) translate(-12 -12)\"><path d=\"M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z\"/></g></svg>",
  "youtube": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><rect class=\"tile\" width=\"24\" height=\"24\" rx=\"5.5\"/><path class=\"glyph\" d=\"M9.6 7.4v9.2l7.6-4.6z\"/></svg>",
  "linkedin": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><rect class=\"tile\" width=\"24\" height=\"24\" rx=\"5.5\"/><g class=\"glyph\"><circle cx=\"6.45\" cy=\"6.95\" r=\"1.6\"/><rect x=\"5.15\" y=\"9.8\" width=\"2.6\" height=\"8.4\"/><path d=\"M9.6 9.8h2.5v1.4c.6-1 1.7-1.6 3.1-1.6 2.5 0 3.8 1.5 3.8 4.4v4.2h-2.6v-3.9c0-1.6-.6-2.5-1.9-2.5-1.4 0-2.3 1-2.3 2.7v3.7H9.6z\"/></g></svg>",
  "substack": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><rect class=\"tile\" width=\"24\" height=\"24\" rx=\"5.5\"/><g class=\"glyph\" transform=\"translate(12 12) scale(0.56) translate(-12 -12)\"><path d=\"M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z\"/></g></svg>"
};

(function render(){
  function make(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  const initials = PAGE.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

  // Photo
  const photo = document.getElementById("photo");
  if (PAGE.photo) {
    const img = make("img");
    img.src = PAGE.photo;
    img.alt = PAGE.name;
    photo.appendChild(img);
  } else {
    photo.appendChild(make("span", "initials", initials));
  }

  // Name
  document.getElementById("name").textContent = PAGE.name;

  // Social icons
  const socials = document.getElementById("socials");
  PAGE.socials.forEach(s => {
    const a = make("a");
    a.href = s.url;
    a.setAttribute("aria-label", s.label);
    a.setAttribute("data-umami-event", "social-" + s.icon);
    if (ICONS[s.icon]) a.innerHTML = ICONS[s.icon];
    else a.textContent = s.label;
    socials.appendChild(a);
  });

  // Link cards
  const list = document.getElementById("links");
  PAGE.links.filter(l => l.show !== false).forEach(l => {
    const card = make("article", "card");

    const head = make("div", "card-head");
    const logo = make("div", "logo");
    if (l.image) {
      const img = make("img");
      img.src = l.image;
      img.alt = "";
      img.loading = "lazy";
      logo.appendChild(img);
    } else {
      logo.textContent = l.name.trim().charAt(0).toUpperCase();
    }
    head.appendChild(logo);
    head.appendChild(make("h2", "card-name", l.name));
    card.appendChild(head);

    if (l.headline) card.appendChild(make("p", "card-headline", l.headline));

    if (l.text) {
      const p = make("p", "card-text");
      if (l.code && l.text.includes(l.code)) {
        const parts = l.text.split(l.code);
        parts.forEach((part, i) => {
          p.appendChild(document.createTextNode(part));
          if (i < parts.length - 1) p.appendChild(make("mark", null, l.code));
        });
      } else {
        p.textContent = l.text;
      }
      card.appendChild(p);
    }

    const foot = make("div", "card-foot");
    const btn = make("a", "card-btn", l.button);
    btn.href = l.url;
    btn.setAttribute("data-umami-event", l.id);
    foot.appendChild(btn);
    if (l.smallPrint) foot.appendChild(make("p", "card-small", l.smallPrint));
    card.appendChild(foot);

    list.appendChild(card);
  });

  // Click stats (Umami, no cookies). Only counts visits on the live domain.
  if (PAGE.umamiWebsiteId) {
    const t = document.createElement("script");
    t.defer = true;
    t.src = "https://cloud.umami.is/script.js";
    t.setAttribute("data-website-id", PAGE.umamiWebsiteId);
    t.setAttribute("data-domains", "zerotoinvestor.co.uk,www.zerotoinvestor.co.uk");
    document.head.appendChild(t);
  }
})();
</script>
</body>
</html>
