<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero to Investor</title>
<meta name="description" content="UK investing videos and a weekly email from Nick Crease.">
<link rel="canonical" href="https://zerotoinvestor.co.uk/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-zti-32.png">
<link rel="apple-touch-icon" href="/favicon-zti-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{--charcoal:#191919;--ink:#111111;--white:#ffffff;--yellow:#FFD200;--grey:#9a9a9a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--charcoal);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;
  }
  .wordmark{font-family:"Bebas Neue",sans-serif;line-height:.9;user-select:none}
  .wordmark .l1{display:block;font-size:56px;letter-spacing:.06em}
  .wordmark .l2{display:block;font-size:20px;letter-spacing:.9em;margin:2px 0 6px .9em}
  .wordmark .l3{display:block;font-size:56px;letter-spacing:.06em;color:var(--yellow)}
  p{margin-top:24px;font-size:17px;line-height:1.55;max-width:40ch}
  .links{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{
    display:inline-block;font-weight:700;font-size:16px;text-decoration:none;
    padding:14px 22px;border-radius:6px;
  }
  a.primary{background:var(--yellow);color:var(--ink)}
  a.secondary{border:1px solid rgba(255,255,255,.35);color:var(--white)}
  a.btn:hover{filter:brightness(1.07)}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  footer{margin-top:40px;font-size:12.5px;color:var(--grey)}
</style>
</head>
<body>
  <div class="wordmark" aria-label="Zero to Investor">
    <span class="l1">ZERO</span>
    <span class="l2">TO</span>
    <span class="l3">INVESTOR</span>
  </div>
  <p>UK investing, from someone who spent a decade in the fund industry.</p>
  <div class="links">
    <a class="btn primary" href="/cheatsheet/">Get the free ETF cheat sheet</a>
    <a class="btn secondary" href="https://www.youtube.com/@nickcrease">Watch on YouTube</a>
  </div>
  <footer>Nothing here is financial advice. Always do your own research.</footer>
</body>
</html>
